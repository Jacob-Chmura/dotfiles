# ==============================================================================
# Requirements & Dependencies
# ==============================================================================
# OS:        Linux (X11/Wayland with compositor support for opacity/blur)
# Shell:     zsh
# Font:      Iosevka Fixed (or Iosevka Fixed Nerd Font for glyphs)

# ==============================================================================
# Environment & Shell
# ==============================================================================

[terminal]
shell = { program = "/usr/bin/env", args = ["zsh", "-l", "-c", "tmux attach-session || tmux new-session"] }

# ==============================================================================
# Window Aesthetics (Modern & Minimal)
# ==============================================================================

[window]
opacity = 0.6
blur = true

# ==============================================================================
# Typography
# ==============================================================================

[font]
size = 12.0

[font.normal]
family = "Iosevka Fixed"
style = "Regular"

[font.bold]
family = "Iosevka Fixed"
style = "Bold"

[font.italic]
family = "Iosevka Fixed"
style = "Italic"

[font.bold_italic]
family = "Iosevka Fixed"
style = "Bold Italic"
