# ==============================================================================
# System Dependencies & Requirements
# ==============================================================================
# Binaries:  tmux (>= 3.2 for popups), xclip, lazygit
# Scripts:   ~/.local/bin/scripts/tmux-sessionizer
# Terminal:  Alacritty (or any terminal with truecolor support)

# ==============================================================================
# General & Server Settings
# ==============================================================================

# Leader key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Fast config reload
bind r source-file ~/.tmux.conf

# System integration & responsiveness
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 100000

# ==============================================================================
# Status Bar & Aesthetics
# ==============================================================================

set -g default-terminal "tmux-256color"

# Enable True Color (24-bit) for any host terminal identifier
set -a terminal-features '*:RGB'
set -ga terminal-overrides ',*:Tc'

# Preserve undercurl and underline colors for Neovim / Syntax Highlighting
set -as terminal-overrides ',*:Smulx=\E[4%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Status bar structure
set -g status-left ""
set -g status-right "#[fg=#89b4fa,bold]#S "
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"

# Window list formatting
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "

# Pane border colors
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ==============================================================================
# Windows & Panes
# ==============================================================================

# Indexing & renumbering
set -g base-index 1
set -g renumber-windows on

# Window management & creation
bind c new-window -c "#{pane_current_path}"
bind q kill-window

# Pane splits & creation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==============================================================================
# Copy Mode & Selection
# ==============================================================================

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X cancel

# ==============================================================================
# Popups & Tooling Binds
# ==============================================================================

# Sessionizer popup
bind-key -r f popup -w 80% -h 60% -E "~/.local/bin/scripts/tmux-sessionizer"

# Git TUI popup
bind g popup -d "#{pane_current_path}" -w 93% -h 93% -E "lazygit"
